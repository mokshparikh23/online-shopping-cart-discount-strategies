plugins {
    id 'java'
    id 'application'
}

group = 'com.company'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
}

application {
    mainClass = 'com.company.cart.Main'
}
